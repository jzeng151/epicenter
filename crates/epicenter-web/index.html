<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPICENTER — Implementation Testing Studio</title>
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
      :root {
        --bg: #080c14;
        --bg-elevated: #0c1220;
        --panel: #0f1624;
        --panel-alt: #131c2e;
        --panel-hover: #172236;
        --border: #1e293b;
        --border-bright: #475569;
        --border-control: #64748b;
        --text: #e2e8f0;
        --text-muted: #a8b7cc;
        --text-dim: #8b9db5;
        --cyan: #38bdf8;
        --cyan-soft: rgba(56, 189, 248, 0.14);
        --emerald: #10b981;
        --emerald-soft: rgba(16, 185, 129, 0.14);
        --amber: #f59e0b;
        --amber-soft: rgba(245, 158, 11, 0.14);
        --red: #ef4444;
        --red-strong: #dc2626;
        --red-soft: rgba(239, 68, 68, 0.15);
        --violet: #a78bfa;
        --violet-soft: rgba(167, 139, 250, 0.14);
        --focus-ring: #7dd3fc;
        --radius: 12px;
        --radius-sm: 8px;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        scroll-padding-top: 84px;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.09), transparent 52%),
          radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.05), transparent 40%),
          linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .skip-link {
        position: absolute;
        left: -9999px;
        top: 10px;
        z-index: 100;
        padding: 10px 16px;
        border-radius: var(--radius-sm);
        background: var(--cyan);
        color: #04101a;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        left: 16px;
        outline: 2px solid #f8fafc;
        outline-offset: 2px;
      }

      :where(a, button, input, select, textarea, summary, [tabindex="0"]):focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: #243247;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334766;
      }

      a {
        color: var(--cyan);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      .epicenter-app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Top Studio Header ──────────────────────────────────────── */
      .studio-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(8, 12, 20, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 14px 28px;
      }

      .studio-header-inner {
        max-width: 1520px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }

      .brand-cluster {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-emblem {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: radial-gradient(circle at center, rgba(56, 189, 248, 0.24), rgba(15, 22, 36, 0.95));
        border: 1px solid rgba(56, 189, 248, 0.42);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.2);
      }

      .brand-title-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand-wordmark {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: #f8fafc;
        line-height: 1.1;
      }

      .brand-sub {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.02em;
      }

      .model-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot-cyan { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
      .dot-violet { background: var(--violet); box-shadow: 0 0 6px var(--violet); }
      .dot-emerald { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
      .dot-amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
      .dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }

      .model-strip {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .model-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-family: var(--font-mono);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text-muted);
        white-space: nowrap;
      }

      .model-pill strong {
        color: #f8fafc;
        font-weight: 700;
      }

      .model-pill-decision {
        border-color: rgba(167, 139, 250, 0.45);
        background: var(--violet-soft);
        color: #e2e8f0;
      }

      .model-pill-decision strong {
        color: #ddd6fe;
      }

      .intake-triage-hint {
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(239, 68, 68, 0.45);
        border-left: 3px solid var(--red);
        background: rgba(239, 68, 68, 0.12);
        color: #fecaca;
        font-size: 12px;
        line-height: 1.45;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .status-pills {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-family: var(--font-mono);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text-muted);
      }

      .status-chip.ok {
        border-color: rgba(16, 185, 129, 0.38);
        background: rgba(16, 185, 129, 0.1);
        color: #6ee7b7;
      }

      .status-chip.warn {
        border-color: rgba(245, 158, 11, 0.4);
        background: rgba(245, 158, 11, 0.1);
        color: #fcd34d;
      }

      .status-chip.err {
        border-color: rgba(239, 68, 68, 0.45);
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
      }

      .tab-toggle {
        display: inline-flex;
        padding: 3px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        gap: 3px;
      }

      .tab-btn {
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 13px;
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.16s ease;
      }

      .tab-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }

      .tab-btn.active {
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(16, 185, 129, 0.16));
        color: #f8fafc;
        box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.45);
      }

      /* ── Main Layout & Panels ───────────────────────────────────── */
      .studio-main {
        flex: 1;
        width: 100%;
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 28px 56px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .panel-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #f8fafc;
      }

      .panel-subtitle {
        font-size: 12.5px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .panel-body {
        padding: 20px 22px;
      }

      /* ── Buttons & Form Controls ────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-control);
        background: var(--panel-alt);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: var(--panel-hover);
        border-color: var(--cyan);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0284c7, #0ea5e9);
        border-color: #38bdf8;
        color: #04101a;
        font-weight: 700;
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.22);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #0ea5e9, #38bdf8);
        border-color: #7dd3fc;
      }

      .btn-emerald {
        background: linear-gradient(135deg, #059669, #10b981);
        border-color: #34d399;
        color: #03150e;
        font-weight: 700;
      }

      .btn-emerald:hover:not(:disabled) {
        background: linear-gradient(135deg, #10b981, #34d399);
      }

      .btn-danger {
        background: rgba(239, 68, 68, 0.16);
        border-color: rgba(239, 68, 68, 0.55);
        color: #fca5a5;
      }

      .btn-danger:hover:not(:disabled) {
        background: rgba(239, 68, 68, 0.26);
        border-color: #ef4444;
      }

      .btn-amber {
        background: rgba(245, 158, 11, 0.14);
        border-color: rgba(245, 158, 11, 0.45);
        color: #fcd34d;
      }

      .btn-amber:hover:not(:disabled) {
        background: rgba(245, 158, 11, 0.22);
        border-color: var(--amber);
      }

      .btn-sm {
        min-height: 32px;
        padding: 6px 11px;
        font-size: 12px;
      }

      .btn-ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-muted);
      }

      .btn-ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--border-control);
        color: var(--text);
      }

      .field-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .input, .select, .textarea {
        width: 100%;
        min-height: 38px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-control);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 13px;
        padding: 9px 12px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .input::placeholder, .textarea::placeholder {
        color: var(--text-dim);
        opacity: 1;
      }

      .input.mono, .textarea.mono, .select.mono {
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .input:focus, .select:focus, .textarea:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
      }

      .input[aria-invalid="true"], .textarea[aria-invalid="true"] {
        border-color: #f87171;
      }

      .textarea {
        min-height: 98px;
        resize: vertical;
        line-height: 1.5;
      }

      /* ── Session Control Strip ──────────────────────────────────── */
      .session-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        flex-wrap: wrap;
      }

      .session-bar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        flex: 1;
        min-width: min(260px, 100%);
      }

      .session-select {
        min-width: min(300px, 100%);
        max-width: 480px;
        flex: 1;
      }

      /* ── 7-Stage Progress Bar ───────────────────────────────────── */
      .seismograph-wrap {
        padding: 16px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .seismograph-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .seismograph-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .seismograph-stages {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .stage-step {
        position: relative;
        padding: 9px 10px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .stage-step.done {
        border-color: rgba(16, 185, 129, 0.4);
        background: rgba(16, 185, 129, 0.08);
      }

      .stage-step.active {
        border-color: rgba(56, 189, 248, 0.72);
        background: rgba(56, 189, 248, 0.14);
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.18);
      }

      .stage-step.failed {
        border-color: rgba(239, 68, 68, 0.65);
        background: rgba(239, 68, 68, 0.12);
      }

      .stage-index {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--panel-alt);
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .stage-step.done .stage-index {
        background: var(--emerald);
        color: #03150e;
      }

      .stage-step.active .stage-index {
        background: var(--cyan);
        color: #03121d;
        animation: seismic-pulse 1.6s 2;
      }

      .stage-step.failed .stage-index {
        background: var(--red-strong);
        color: #ffffff;
      }

      .stage-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-step.done .stage-name,
      .stage-step.active .stage-name {
        color: #f8fafc;
      }

      @keyframes seismic-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55); }
        50% { box-shadow: 0 0 0 6px rgba(56, 189, 248, 0); }
      }

      @keyframes rec-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.82); }
      }

      .rec-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 8px var(--red);
        animation: rec-pulse 1.2s ease-in-out 3;
      }

      /* ── Telemetry Drawer ───────────────────────────────────────── */
      .telemetry-drawer {
        border-top: 1px solid var(--border);
        background: #070b12;
        border-radius: 0 0 var(--radius) var(--radius);
        padding: 12px 16px;
        max-height: 240px;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .telemetry-row {
        display: grid;
        grid-template-columns: 74px 56px 128px minmax(0, 1fr);
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(30, 41, 59, 0.45);
        align-items: baseline;
      }

      .telemetry-row:last-child {
        border-bottom: none;
      }

      .log-ts { color: var(--text-dim); }
      .log-src { color: var(--cyan); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .log-msg { color: var(--text); word-break: break-word; }
      .log-lvl { font-weight: 700; font-size: 10px; text-transform: uppercase; }
      .log-lvl.info { color: var(--emerald); }
      .log-lvl.warn { color: var(--amber); }
      .log-lvl.error { color: var(--red); }
      .log-lvl.debug { color: var(--text-dim); }

      /* ── Intake Deck ────────────────────────────────────────────── */
      .pipeline-flow-strip {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
        margin-bottom: 16px;
        border-radius: var(--radius-sm);
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.08), rgba(16, 185, 129, 0.05));
        border: 1px solid rgba(56, 189, 248, 0.24);
      }

      .pipeline-flow-step {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(8, 12, 20, 0.72);
        border: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .pipeline-flow-step strong {
        color: #f1f5f9;
        font-family: var(--font-mono);
        font-size: 10.5px;
      }

      .pipeline-flow-step.active {
        border-color: rgba(56, 189, 248, 0.55);
        background: rgba(56, 189, 248, 0.14);
        color: #e0f2fe;
      }

      .pipeline-flow-arrow {
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .intake-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.05fr);
        gap: 18px;
        align-items: start;
      }

      .intake-media-col {
        padding: 14px;
        border-radius: var(--radius);
        background: linear-gradient(160deg, rgba(14, 165, 233, 0.07), rgba(15, 22, 36, 0.94));
        border: 1px solid rgba(56, 189, 248, 0.34);
        box-shadow: inset 0 1px 0 rgba(125, 211, 252, 0.08);
      }

      .dropzone-primary {
        border-color: rgba(56, 189, 248, 0.45);
        background: rgba(6, 10, 18, 0.78);
      }

      .intake-preview-empty {
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        border: 1px dashed var(--border);
        background: rgba(8, 12, 20, 0.45);
        font-size: 11.5px;
        color: var(--text-muted);
        text-align: center;
      }

      .intake-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      .intake-preview-card {
        background: var(--bg-elevated);
        border: 1px solid var(--border-bright);
        border-radius: var(--radius-sm);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .intake-preview-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-alt);
      }

      .intake-preview-name {
        font-size: 11px;
        color: #f1f5f9;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .intake-preview-img {
        display: block;
        width: 100%;
        max-height: 210px;
        object-fit: contain;
        background: #05080f;
      }

      .intake-preview-video {
        display: block;
        width: 100%;
        max-height: 210px;
        background: #05080f;
      }

      .intake-preview-audio {
        width: calc(100% - 16px);
        height: 36px;
        margin: 10px 8px;
      }

      .intake-preview-file {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px;
      }

      .form-row-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .form-row-3 {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }

      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task-kind-toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .kind-btn {
        min-height: 36px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-control);
        background: var(--bg-elevated);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .kind-btn.active {
        border-color: var(--cyan);
        background: var(--cyan-soft);
        color: #f8fafc;
      }

      .dropzone {
        position: relative;
        border: 1.5px dashed var(--border-bright);
        border-radius: var(--radius);
        background: rgba(8, 12, 20, 0.65);
        padding: 20px 16px;
        text-align: center;
        transition: all 0.16s ease;
      }

      .dropzone.dragging {
        border-color: var(--cyan);
        background: rgba(56, 189, 248, 0.1);
        box-shadow: inset 0 0 24px rgba(56, 189, 248, 0.16);
      }

      .dropzone-title {
        font-size: 13px;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 4px;
      }

      .dropzone-hint {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      .capture-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
      }

      .attachment-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .attachment-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--panel-alt);
        border: 1px solid var(--border-bright);
        font-size: 12px;
      }

      .attachment-kind {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--cyan-soft);
        color: var(--cyan);
      }

      .attachment-remove {
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        min-width: 28px;
        min-height: 28px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .attachment-remove:hover {
        color: #fca5a5;
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.45);
      }

      /* ── Badges & Alerts ────────────────────────────────────────── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--font-mono);
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text-muted);
      }
      .badge-cyan { border-color: rgba(56, 189, 248, 0.45); background: var(--cyan-soft); color: #7dd3fc; }
      .badge-emerald { border-color: rgba(16, 185, 129, 0.45); background: var(--emerald-soft); color: #6ee7b7; }
      .badge-amber { border-color: rgba(245, 158, 11, 0.48); background: var(--amber-soft); color: #fcd34d; }
      .badge-red { border-color: rgba(239, 68, 68, 0.48); background: var(--red-soft); color: #fca5a5; }
      .badge-violet { border-color: rgba(167, 139, 250, 0.45); background: var(--violet-soft); color: #c4b5fd; }

      .alert-banner {
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
      }
      .alert-banner.err {
        border-color: rgba(239, 68, 68, 0.5);
        background: rgba(239, 68, 68, 0.1);
        color: #fecaca;
      }
      .alert-banner.ok {
        border-color: rgba(16, 185, 129, 0.45);
        background: rgba(16, 185, 129, 0.1);
        color: #a7f3d0;
      }

      /* ── Split Analysis Grid (Viz Mount Points) ─────────────────── */
      .analysis-split {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 22px;
        align-items: start;
      }

      .viz-host {
        min-height: 440px;
      }

      /* ── Briefing & Handoff Deck ────────────────────────────────── */
      .briefing-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.38fr);
        gap: 22px;
      }

      .audio-player-box {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        margin-bottom: 14px;
      }

      .audio-player-box audio {
        width: 100%;
        height: 36px;
        margin-top: 8px;
      }

      .dialogue-feed {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 440px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .dialogue-turn {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
      }

      .dialogue-turn.architect {
        border-left: 3px solid var(--cyan);
      }

      .dialogue-turn.auditor {
        border-left: 3px solid var(--amber);
      }

      .dialogue-speaker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .dialogue-turn.architect .dialogue-speaker { color: var(--cyan); }
      .dialogue-turn.auditor .dialogue-speaker { color: var(--amber); }

      .dialogue-text {
        font-size: 13px;
        color: var(--text);
        margin: 0;
      }

      .handoff-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 14px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 14px;
      }

      .redgate-card {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .diff-container {
        background: #070b12;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: auto;
        max-height: 420px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.48;
      }

      .diff-line {
        display: flex;
        padding: 1px 12px;
        white-space: pre;
        min-width: max-content;
      }

      .diff-ln {
        width: 42px;
        flex-shrink: 0;
        color: var(--text-dim);
        user-select: none;
        text-align: right;
        padding-right: 12px;
      }

      .diff-line-add {
        background: rgba(16, 185, 129, 0.14);
        color: #6ee7b7;
      }

      .diff-line-del {
        background: rgba(239, 68, 68, 0.14);
        color: #fca5a5;
      }

      .diff-line-hunk {
        background: rgba(56, 189, 248, 0.13);
        color: #7dd3fc;
        font-weight: 600;
      }

      .diff-line-meta {
        background: rgba(148, 163, 184, 0.08);
        color: #cbd5e1;
        font-weight: 700;
      }

      .diff-line-ctx {
        color: #cbd5e1;
      }

      .terminal-box {
        background: #060910;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: #cbd5e1;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 180px;
        overflow-y: auto;
        margin: 0;
      }

      .empty-state {
        padding: 28px 20px;
        text-align: center;
        color: var(--text-muted);
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
        background: rgba(8, 12, 20, 0.45);
      }

      /* ── Multimodal Evidence & Hydrogen Findings Panel ──────────── */
      .media-evidence-panel {
        border-color: rgba(56, 189, 248, 0.34);
      }

      .media-evidence-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .evidence-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .evidence-col-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }

      .evidence-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .evidence-card {
        background: var(--bg-elevated);
        border: 1px solid var(--border-bright);
        border-radius: 10px;
        overflow: hidden;
      }

      .evidence-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .evidence-filename {
        font-size: 12px;
        color: #f8fafc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 280px;
      }

      .evidence-media-wrap {
        padding: 10px;
        background: #060911;
      }

      .evidence-img {
        display: block;
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #04070d;
      }

      .evidence-video {
        display: block;
        width: 100%;
        max-height: 340px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #04070d;
      }

      .evidence-audio-wrap {
        padding: 12px;
      }

      .evidence-audio {
        width: 100%;
        height: 38px;
      }

      .evidence-file-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        background: #070b13;
      }

      .keyframe-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .keyframe-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .keyframe-status {
        font-size: 11.5px;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }

      .keyframe-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .keyframe-thumb {
        flex: 0 0 132px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-bright);
        border-radius: 7px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .keyframe-thumb img {
        width: 132px;
        height: 78px;
        object-fit: cover;
        display: block;
        background: #04070d;
      }

      .keyframe-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px;
        background: var(--panel-alt);
      }

      .keyframe-ts {
        font-family: var(--font-mono);
        font-size: 10.5px;
        font-weight: 700;
        color: #c4b5fd;
      }

      .finding-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .finding-card {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-left: 3px solid var(--cyan);
        border-radius: 9px;
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .finding-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .finding-summary {
        margin: 0;
        font-size: 12.5px;
        color: var(--text);
        line-height: 1.5;
      }

      .symbol-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .symbol-chip {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: #7dd3fc;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.34);
      }

      .repro-contract-block {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px 12px;
      }

      .suspect-files-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .suspect-file-pill {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        color: #fcd34d;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.36);
      }

      .repro-steps-list {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12.5px;
        color: #cbd5e1;
      }

      /* ── Honest Halt & Simulated Data Warning Banners ───────────── */
      .honest-halt-banner {
        margin-bottom: 16px;
        padding: 14px 16px;
        border-radius: 10px;
        background: linear-gradient(145deg, rgba(239, 68, 68, 0.18), rgba(127, 29, 29, 0.24));
        border: 1px solid rgba(239, 68, 68, 0.58);
        border-left: 4px solid var(--red);
        box-shadow: 0 0 22px rgba(239, 68, 68, 0.14);
      }

      .honest-halt-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .honest-halt-title {
        font-size: 13.5px;
        color: #fef2f2;
      }

      .honest-halt-body {
        margin: 0;
        font-size: 12.5px;
        color: #fecaca;
        line-height: 1.5;
      }

      .sim-warning-banner {
        padding: 12px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.22), rgba(245, 158, 11, 0.22));
        border: 1.5px solid var(--amber);
        border-left: 5px solid var(--red);
        color: #fef3c7;
        font-size: 12.5px;
        font-weight: 700;
      }

      .mono {
        font-family: var(--font-mono);
      }

      /* ── Code Impact Map Component Styles ───────────────────────── */
      .epi-ripple-card {
        background: #0f1624;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 20px 22px;
        color: #e2e8f0;
        font-family: var(--font-sans);
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      }
      .epi-ripple-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 14px;
      }
      .epi-ripple-title-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .epi-ripple-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .epi-ripple-subtitle {
        font-size: 12.5px;
        color: var(--text-muted);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .epi-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid #334155;
        background: #0b1220;
        color: #cbd5e1;
        font-family: var(--font-mono);
      }
      .epi-pill-cyan { color: #7dd3fc; border-color: rgba(56, 189, 248, 0.42); background: rgba(56, 189, 248, 0.12); }
      .epi-pill-violet { color: #c4b5fd; border-color: rgba(167, 139, 250, 0.42); background: rgba(167, 139, 250, 0.12); }
      .epi-pill-emerald { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.42); background: rgba(16, 185, 129, 0.12); }
      .epi-pill-amber { color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.12); }
      .epi-pill-red { color: #fca5a5; border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.14); }

      .epi-zoom-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
      }
      .epi-zoom-btn {
        background: #131d31;
        color: #e2e8f0;
        border: 1px solid var(--border-control);
        border-radius: 7px;
        min-width: 30px;
        min-height: 28px;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: border-color 140ms ease, background 140ms ease, color 140ms ease;
      }
      .epi-zoom-btn:hover {
        border-color: #38bdf8;
        color: #7dd3fc;
        background: #16233b;
      }
      .epi-zoom-readout {
        font-size: 11px;
        color: var(--text-muted);
        font-family: var(--font-mono);
        min-width: 40px;
        text-align: center;
      }
      .epi-ripple-metrics-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .epi-ripple-stage {
        position: relative;
        background: radial-gradient(circle at 50% 50%, #101a2e 0%, #090e19 65%, #060a12 100%);
        border: 1px solid #1e293b;
        border-radius: 12px;
        overflow: hidden;
        user-select: none;
      }
      .epi-ripple-svg {
        width: 100%;
        height: auto;
        max-height: 540px;
        display: block;
      }
      .epi-ripple-hint {
        position: absolute;
        bottom: 10px;
        right: 12px;
        font-size: 11px;
        color: var(--text-dim);
        background: rgba(8, 12, 20, 0.88);
        border: 1px solid #334155;
        padding: 3px 8px;
        border-radius: 6px;
        pointer-events: none;
        font-family: var(--font-mono);
      }
      @keyframes epi-darkzone-pulse {
        0% { transform: scale(1); opacity: 0.9; }
        70% { transform: scale(1.55); opacity: 0.0; }
        100% { transform: scale(1.55); opacity: 0.0; }
      }
      @keyframes epi-epicenter-breathe {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1.0; }
      }
      .epi-darkzone-pulse-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: epi-darkzone-pulse 1.8s cubic-bezier(0.22, 0.61, 0.36, 1) 2;
      }
      .epi-epicenter-glow-ring {
        animation: epi-epicenter-breathe 2.0s ease-in-out 2;
      }
      .epi-node-group {
        cursor: pointer;
      }
      .epi-node-group:focus-visible {
        outline: none;
      }
      .epi-ripple-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        font-size: 11.5px;
        color: var(--text-muted);
        padding: 2px 4px;
      }
      .epi-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .epi-legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        display: inline-block;
      }
      .epi-bandaid-alert {
        background: rgba(245, 158, 11, 0.10);
        border: 1px solid rgba(245, 158, 11, 0.45);
        border-left: 4px solid #f59e0b;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        color: #fde68a;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .epi-bandaid-title {
        font-weight: 700;
        color: #fcd34d;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .epi-inspector-card {
        background: #0b1220;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .epi-inspector-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .epi-inspector-symbol {
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 700;
        color: #7dd3fc;
        word-break: break-all;
      }
      .epi-inspector-loc {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .epi-cov-bar-track {
        width: 100%;
        height: 7px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
      }
      .epi-cov-bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 200ms ease;
      }
      .epi-neighbor-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
