[workspace]
resolver = "2"
members = [
    "crates/epicenter-common",
    "crates/epicenter-graph",
    "crates/epicenter-gemini",
    "crates/epicenter-engine",
    "crates/epicenter-server",
    "crates/epicenter-web",
    "crates/epicenter-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jzeng151/epicenter"

[workspace.dependencies]
# Shared / WASM-safe dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "js", "serde"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Native async / HTTP / utilities
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Graph / AST analysis
petgraph = "0.7"
regex = "1"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

# Server
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Web (WASM)
leptos = { version = "0.8", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Navigator",
    "EventSource",
    "MessageEvent",
    "HtmlAudioElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "Element",
    "SvgElement",
    "Blob",
    "BlobEvent",
    "BlobPropertyBag",
    "Url",
    "FormData",
    "File",
    "FileList",
    "DragEvent",
    "DataTransfer",
    "MouseEvent",
    "WheelEvent",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "DisplayMediaStreamConstraints",
    "MediaRecorder",
    "MediaRecorderOptions",
    "Clipboard",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
console_error_panic_hook = "0.1"

# CLI / Testing
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Internal workspace crates
epicenter-common = { path = "crates/epicenter-common" }
epicenter-graph = { path = "crates/epicenter-graph" }
epicenter-gemini = { path = "crates/epicenter-gemini" }
epicenter-engine = { path = "crates/epicenter-engine" }
